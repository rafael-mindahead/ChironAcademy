name: ChironAcademy CI

on:
  push:
    branches:
      - main
      - feature/sprint-2
  pull_request:

jobs:
  backend-syntax:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/pages/ChironAcademy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/pages/ChironAcademy/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
