services:
  backend:
    build: .
    container_name: chiron_academy_backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: chironAcademyData
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      - database

  database:
    image: mysql:8.4
    container_name: chiron_academy_database
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chironAcademyData

    ports:
      - "3306:3306"

    volumes:
      - chiron_academy_data:/var/lib/mysql

volumes:
  chiron_academy_data: